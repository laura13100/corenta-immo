name: Deploy marketing site to Pages

on:
  push:
    branches:
      - claude/elegant-hypatia-fldgyx
    paths:
      - "index.html"
      - "proprietaire.html"
      - "css/**"
      - "js/**"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html proprietaire.html _site/
          cp -r css js images _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
